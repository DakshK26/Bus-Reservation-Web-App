spring:
  datasource:
    url: jdbc:h2:mem:busdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  cache:
    type: simple
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
  data:
    redis:
      host: localhost
      port: 6379

# Dev: disable security for H2 console
  security:
    user:
      name: admin
      password: admin

app:
  jwt:
    secret: dev-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256-algorithm-padding
    expiration-ms: 86400000
  bigquery:
    enabled: false
  seed:
    enabled: true

logging:
  level:
    com.web.bus: DEBUG
    org.springframework.security: DEBUG
